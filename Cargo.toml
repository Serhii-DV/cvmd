[package]
name = "cvmd"
version = "0.1.0"
edition = "2024"
description = "A file-first CLI for managing, tailoring and exporting Markdown CVs"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
